<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3a8c">
<title>Mis hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#fafaf6; --linea:#d5ddeb; --tinta:#2b3a8c; --tinta2:#5b67a6;
  --fluo:#b6e23f; --fluo-suave:#f3fadf; --texto:#1c2240; --gris:#737a96; --rojo:#b3362b;
  --mano:'Kalam','Comic Sans MS',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--texto);
  background-color:var(--papel);
  background-image:linear-gradient(var(--linea) 1px,transparent 1px),linear-gradient(90deg,var(--linea) 1px,transparent 1px);
  background-size:24px 24px;
  background-attachment:fixed;
  padding:env(safe-area-inset-top,0px) 0 calc(76px + env(safe-area-inset-bottom,0px));
}
main{max-width:560px;margin:0 auto;padding:12px 14px 24px}
h2,h3,.fecha b{font-family:var(--mano);color:var(--tinta);font-weight:700}
h2{font-size:28px;margin:6px 0 10px}
h3{font-size:21px;margin:0 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--tinta2);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--texto);background:#fff;border:1px solid var(--linea);border-radius:8px;padding:9px 10px;width:100%}
.prim{background:var(--tinta);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.sec{background:#fff;border:1px solid var(--tinta2);color:var(--tinta);border-radius:8px;padding:9px 12px}
.peligro{background:#fff;border:1px solid var(--rojo);color:var(--rojo);border-radius:8px;padding:9px 12px}
.link{background:none;border:0;color:var(--tinta);text-decoration:underline;padding:0}
small{color:var(--gris)}

.fecha{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.fecha>div{text-align:center;display:flex;flex-direction:column}
.fecha b{font-size:26px;line-height:1.1}
.fecha>button{width:46px;height:46px;border-radius:50%;border:1px solid var(--linea);background:#fff;font-size:26px;line-height:1;color:var(--tinta)}
.fecha>button:disabled{opacity:.3}

.lista{display:flex;flex-direction:column;gap:8px}
.hab{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:62px;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:10px 12px}
.hab .txt{display:flex;flex-direction:column;min-width:0}
.hab .nom{font-weight:600}
.hab .min{font-size:13px;color:var(--gris)}
.hab .meta{font-size:13px;color:var(--tinta);font-weight:600}
.caja{flex:none;width:42px;height:42px;border:2px solid var(--tinta);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--tinta);background:#fff}
.hab.s2{background:var(--fluo-suave);border-color:#cfe79a}
.hab.s2 .caja{background:var(--fluo)}
.hab.s1 .caja{background:linear-gradient(to top,var(--fluo) 50%,#fff 50%)}
.ayuda{font-size:13px;color:var(--gris);margin:8px 2px 0}
.vacio{background:#fff;border:1px dashed var(--linea);border-radius:10px;padding:16px;text-align:center}

.bloque{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:12px;margin-top:14px}
.est{display:flex;align-items:center;gap:8px}
.est button{background:#fff;border:1px solid var(--tinta2);color:var(--tinta);border-radius:8px;min-width:54px;height:44px}
.est output{flex:1;text-align:center;font-family:var(--mano);font-size:26px;color:var(--tinta)}
.ej{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid #eef1f7}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--gris);padding:0 6px}
.ejform{display:grid;grid-template-columns:1fr 84px;gap:8px;margin-top:8px}
.ejform input#ejn,.ejform button{grid-column:1/-1}

.banner{background:#fff6d6;border:1px solid #e8cf73;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner button{margin-top:6px}

.nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--linea);background:#fff;font-size:24px;color:var(--tinta)}
.nav button:disabled{opacity:.3}
.nav b{font-family:var(--mano);font-size:22px;color:var(--tinta)}
.grid{overflow-x:auto;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:8px}
table{border-collapse:collapse}
th,td{padding:0}
th.nom{position:sticky;left:0;z-index:1;background:#fff;text-align:left;font-weight:400;font-size:13px;min-width:112px;max-width:128px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
th.d{font-size:11px;font-weight:600;color:var(--tinta);min-width:22px;text-align:center}
th.d button{background:none;border:0;padding:2px 0;font-size:11px;font-weight:600;color:var(--tinta);width:100%}
.sem th.d{min-width:36px}
td.c{width:22px;height:22px;border:1px solid var(--linea)}
.sem td.c{width:36px;height:34px}
td.s2{background:var(--fluo)}
td.s1{background:linear-gradient(to top,var(--fluo) 50%,#fff 50%)}
td.na{background:repeating-linear-gradient(45deg,#eef0f6 0 3px,#fff 3px 6px)}
td.fut{background:#fbfbfd}
td.n{font-size:11px;text-align:center;color:var(--tinta);border:1px solid var(--linea);height:22px;min-width:22px}
.sem td.n{height:30px}
td.tot{font-size:12px;padding-left:6px;white-space:nowrap;color:var(--tinta);font-weight:600}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--gris);margin:8px 2px}
.leyenda i{display:inline-block;width:12px;height:12px;border:1px solid var(--linea);vertical-align:-2px;margin-right:4px}

.resumen{font-size:15px;margin:12px 2px}
.fila{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f7}
.fila:last-child{border-bottom:0}
.fila .izq{min-width:0}
.fila .der{text-align:right;flex:none}
.pct{font-family:var(--mano);font-size:22px;color:var(--tinta);line-height:1}
.barra{height:6px;background:#eef1f7;border-radius:3px;margin-top:5px;overflow:hidden}
.barra span{display:block;height:100%;background:var(--fluo)}
.comp{display:grid;grid-template-columns:62px 1fr 64px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.comp .barra{height:14px;margin:0}

.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef1f7}
.hrow .acc{display:flex;gap:4px;flex:none}
.hrow .acc button{min-width:40px;height:40px;border-radius:8px;border:1px solid var(--linea);background:#fff;color:var(--tinta)}
.form{background:var(--fluo-suave);border:1px solid #cfe79a;border-radius:10px;padding:12px;margin:8px 0;display:flex;flex-direction:column;gap:10px}
.form label{font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.radios{display:flex;flex-direction:column;gap:6px;font-size:15px}
.radios label{flex-direction:row;align-items:center;font-weight:400;gap:8px}
.radios input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{width:40px;height:40px;border-radius:50%;border:1px solid var(--tinta2);background:#fff;color:var(--tinta);font-weight:600}
.chip.on{background:var(--tinta);color:#fff}
.botones{display:flex;gap:8px;flex-wrap:wrap}
textarea{resize:vertical}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:14px;color:var(--gris);border-top:3px solid transparent}
.tabs button.on{color:var(--tinta);font-weight:700;border-top-color:var(--fluo)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;max-width:90%;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.ver{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Secciones">
  <button data-tab="hoy" class="on">Hoy</button>
  <button data-tab="semana">Semana</button>
  <button data-tab="mes">Mes</button>
  <button data-tab="habitos">Hábitos</button>
</nav>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="archivo" accept=".json,application/json,text/plain" hidden>

<script>
/* ====== utilidades de fecha ====== */
const pad=n=>String(n).padStart(2,'0');
const K=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c);};
const add=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const lunes=d=>add(d,-((d.getDay()+6)%7));
const HOY=()=>K(new Date());
const DL=['D','L','M','M','J','V','S'];
const DN=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtMin=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');
const fmtCorto=m=>m?(m%60===0?(m/60)+'h':(m/60).toFixed(1).replace('.',',')+'h'):'';
const TIPOS=['Movilidad','Fuerza','Cardio','Boxeo','Estiramiento','Otro'];

/* ====== datos ====== */
const CLAVE='habitos_benja_v1';
function base(){
  const hoy=HOY(), LS=[1,2,3,4,5,6], TODOS=[0,1,2,3,4,5,6];
  const h=(nombre,minimo,tipo,dias,meta)=>({id:uid(),nombre,minimo,tipo,dias,meta:meta||1,creado:hoy,archivado:null,pausas:[]});
  return {v:1,habitos:[
    h('Hacer la cama','Estirar el acolchado','dia',LS),
    h('Movilidad y estiramiento','2 minutos de estiramiento','dia',LS),
    h('Propósito','Una sola frase con la mano izquierda','dia',LS),
    h('Fundamentos','Leer el cartel en voz alta','dia',LS),
    h('Orar','Un minuto de oración','dia',LS),
    h('Micro estudio (Duolingo)','Una lección','dia',LS),
    h('Leer 10 páginas','Leer 1 página','dia',LS),
    h('Ejercicio fuerte','20 minutos en vez de la rutina completa','semana',TODOS,3),
    h('Cosas de la casa','Una sola tarea chica','semana',[6,0],1),
    h('Planear la semana','15 minutos en vez de 1 hora','semana',[6,0],1)
  ],dias:{},metaFinde:240,ultimaCopia:null};
}
function migrar(d){
  d.habitos.forEach(h=>{h.pausas=h.pausas||[];h.meta=h.meta||1;h.dias=Array.isArray(h.dias)&&h.dias.length?h.dias:[0,1,2,3,4,5,6];h.tipo=h.tipo==='semana'?'semana':'dia';h.creado=h.creado||HOY();});
  d.dias=d.dias||{}; if(d.metaFinde==null)d.metaFinde=240; d.v=1;
  return d;
}
function cargar(){try{const r=localStorage.getItem(CLAVE);if(r)return migrar(JSON.parse(r));}catch(e){}return base();}
let S=cargar();
function guardar(){try{localStorage.setItem(CLAVE,JSON.stringify(S));}catch(e){toast('No se pudo guardar. Hacé una copia ya.');}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

const st=(k,id)=>(S.dias[k]&&S.dias[k].h&&S.dias[k].h[id])||0;
const dia=k=>S.dias[k]||(S.dias[k]={h:{},est:0,ej:[],nota:''});
const vive=(h,k)=>k>=h.creado&&!(h.archivado&&k>=h.archivado)&&!h.pausas.some(p=>k>=p.desde&&k<p.hasta);
const prog=(h,k)=>vive(h,k)&&h.dias.includes(P(k).getDay());
function cuentaSemana(h,mon){let c=0;for(let i=0;i<7;i++){const k=K(add(mon,i));if(vive(h,k)&&st(k,h.id))c++;}return c;}

/* ====== rachas ====== */
function rachaDia(h){
  const hoy=HOY(); let d=new Date(); if(!st(hoy,h.id))d=add(d,-1);
  let n=0;
  for(let i=0;i<4000;i++){const k=K(d);if(k<h.creado)break;if(prog(h,k)){if(st(k,h.id))n++;else break;}d=add(d,-1);}
  return n;
}
function mejorDia(h){
  const hoy=HOY(); let d=P(h.creado),best=0,run=0;
  while(K(d)<=hoy){const k=K(d);if(prog(h,k)){if(st(k,h.id)){run++;if(run>best)best=run;}else if(k<hoy)run=0;}d=add(d,1);}
  return best;
}
function rachaSem(h){
  let mon=lunes(new Date()); if(cuentaSemana(h,mon)<h.meta)mon=add(mon,-7);
  let n=0;
  while(K(add(mon,6))>=h.creado){if(cuentaSemana(h,mon)>=h.meta)n++;else break;mon=add(mon,-7);}
  return n;
}
function mejorSem(h){
  const hoy=HOY(); let mon=lunes(P(h.creado)),best=0,run=0;
  while(K(mon)<=hoy){if(cuentaSemana(h,mon)>=h.meta){run++;if(run>best)best=run;}else if(K(add(mon,6))<hoy)run=0;mon=add(mon,7);}
  return best;
}
function statsMes(y,m){
  const n=new Date(y,m+1,0).getDate(),hoy=HOY(); let p=0,c=0,mn=0,est=0;
  for(let i=1;i<=n;i++){const k=K(new Date(y,m,i));if(k>hoy)break;est+=(S.dias[k]&&S.dias[k].est)||0;
    S.habitos.forEach(h=>{if(h.tipo==='dia'&&prog(h,k)){p++;const s=st(k,h.id);if(s)c++;if(s===1)mn++;}});}
  return {p,c,mn,est,pct:p?Math.round(c/p*100):null};
}

/* ====== estado de pantalla ====== */
let tab='hoy', cur=HOY(), semOff=0, editId=null, formDias=[];
const hoyD=new Date(); let mesSel={y:hoyD.getFullYear(),m:hoyD.getMonth()};

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('ver');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('ver'),2800);}

function banner(){
  if(!Object.keys(S.dias).length)return '';
  const d=S.ultimaCopia?Math.round((P(HOY())-P(S.ultimaCopia))/864e5):null;
  if(d!==null&&d<7)return '';
  return `<div class="banner">${d===null?'Todavía no hiciste ninguna copia de seguridad.':'Hace '+d+' días que no hacés una copia de seguridad.'} Si el celular borra los datos del navegador, se pierde todo.<br><button class="sec" data-act="ircopia">Hacer copia ahora</button></div>`;
}

/* ====== vista HOY ====== */
function vHoy(){
  const d=P(cur),hoy=HOY(),r=S.dias[cur]||{};
  let h=banner();
  h+=`<div class="fecha"><button data-act="dprev" aria-label="Día anterior">‹</button><div><b>${cap(DN[d.getDay()])} ${d.getDate()} de ${MN[d.getMonth()]}</b>${cur===hoy?'<small>hoy</small>':'<small><button class="link" data-act="dhoy">Volver a hoy</button></small>'}</div><button data-act="dnext" aria-label="Día siguiente" ${cur>=hoy?'disabled':''}>›</button></div>`;
  const act=S.habitos.filter(x=>prog(x,cur));
  if(!act.length)h+=`<p class="vacio">No hay hábitos programados para este día.${d.getDay()===0?' Domingo de descanso.':''}</p>`;
  else{
    h+='<div class="lista">'+act.map(x=>{
      const s=st(cur,x.id);
      const extra=x.tipo==='semana'?`<span class="meta">${cuentaSemana(x,lunes(d))} de ${x.meta} esta semana</span>`:'';
      return `<button class="hab s${s}" data-act="tog" data-id="${x.id}"><span class="txt"><span class="nom">${esc(x.nombre)}</span><span class="min">${s===1?'Hecho en versión mínima':'Mínimo: '+esc(x.minimo||'sin definir')}</span>${extra}</span><span class="caja" aria-hidden="true">${s===2?'✓':s===1?'½':''}</span></button>`;
    }).join('')+'</div><p class="ayuda">Un toque: hecho. Dos: versión mínima. Tres: sin marcar.</p>';
  }
  const est=r.est||0;
  h+=`<section class="bloque"><h3>Estudio</h3><div class="est"><button data-act="est" data-v="-15">−15</button><output>${fmtMin(est)}</output><button data-act="est" data-v="15">+15</button><button data-act="est" data-v="60">+1 h</button></div></section>`;
  const ej=r.ej||[];
  h+=`<section class="bloque"><h3>Registro de ejercicio</h3>${ej.map((e,i)=>`<div class="ej"><span><b>${esc(e.t)}</b>${e.m?', '+e.m+' min':''}${e.n?'<br><small>'+esc(e.n)+'</small>':''}</span><button class="x" data-act="ejdel" data-i="${i}" aria-label="Borrar">×</button></div>`).join('')}
  <div class="ejform"><select id="ejt" aria-label="Tipo">${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select><input id="ejm" type="number" inputmode="numeric" min="0" placeholder="min" aria-label="Minutos"><input id="ejn" placeholder="Detalle (opcional): burpees 5x5, plancha 30s x3" aria-label="Detalle"><button class="prim" data-act="ejadd">Agregar ejercicio</button></div></section>`;
  h+=`<section class="bloque"><h3>Nota del día</h3><textarea id="nota" rows="2" placeholder="Opcional: cómo te fue, qué te frenó">${esc(r.nota||'')}</textarea></section>`;
  return h;
}

/* ====== celdas de grilla ====== */
function celda(x,k,hoy){
  if(k>hoy)return '<td class="c fut"></td>';
  if(!vive(x,k))return '<td class="c na"></td>';
  const s=st(k,x.id);
  if(!x.dias.includes(P(k).getDay())&&!s)return '<td class="c na"></td>';
  return `<td class="c s${s}"></td>`;
}
const leyenda=`<div class="leyenda"><span><i style="background:var(--fluo)"></i>Hecho</span><span><i style="background:linear-gradient(to top,var(--fluo) 50%,#fff 50%)"></i>Mínimo</span><span><i></i>No hecho</span><span><i style="background:repeating-linear-gradient(45deg,#eef0f6 0 3px,#fff 3px 6px)"></i>No toca</span></div>`;

/* ====== vista SEMANA ====== */
function vSemana(){
  const mon=add(lunes(new Date()),semOff*7),ds=[...Array(7)].map((_,i)=>add(mon,i)),ks=ds.map(K),hoy=HOY();
  const fin=ds[6];
  let h=`<h2>Semana</h2><div class="nav"><button data-act="sprev" aria-label="Semana anterior">‹</button><b>${mon.getDate()} ${MN[mon.getMonth()].slice(0,3)} al ${fin.getDate()} ${MN[fin.getMonth()].slice(0,3)}</b><button data-act="snext" aria-label="Semana siguiente" ${semOff>=0?'disabled':''}>›</button></div>`;
  const habs=S.habitos.filter(x=>ks.some(k=>vive(x,k)));
  h+='<div class="grid sem"><table><thead><tr><th class="nom"></th>'+ds.map((d,i)=>`<th class="d">${ks[i]<=hoy?`<button data-act="goday" data-k="${ks[i]}">${DL[d.getDay()]}<br>${d.getDate()}</button>`:DL[d.getDay()]+'<br>'+d.getDate()}</th>`).join('')+'<th></th></tr></thead><tbody>';
  habs.forEach(x=>{
    let tot;
    if(x.tipo==='dia'){let p=0,c=0;ks.forEach(k=>{if(k<=hoy&&prog(x,k)){p++;if(st(k,x.id))c++;}});tot=p?c+'/'+p:'';}
    else tot=cuentaSemana(x,mon)+'/'+x.meta;
    h+=`<tr><th class="nom" title="${esc(x.nombre)}">${esc(x.nombre)}</th>${ks.map(k=>celda(x,k,hoy)).join('')}<td class="tot">${tot}</td></tr>`;
  });
  let estT=0,estF=0,ejN=0;
  const estCeldas=ks.map((k,i)=>{const m=(S.dias[k]&&S.dias[k].est)||0;estT+=m;if(ds[i].getDay()===0||ds[i].getDay()===6)estF+=m;ejN+=((S.dias[k]&&S.dias[k].ej)||[]).length;return `<td class="n">${fmtCorto(m)}</td>`;}).join('');
  h+=`<tr><th class="nom">Estudio</th>${estCeldas}<td class="tot">${fmtCorto(estT)}</td></tr></tbody></table></div>${leyenda}`;
  h+=`<section class="bloque"><div class="fila"><span>Estudio total</span><b>${estT?fmtMin(estT):'0 min'}</b></div><div class="fila"><span>Estudio del fin de semana</span><b>${fmtMin(estF)} de ${fmtMin(S.metaFinde)}</b></div><div class="fila"><span>Ejercicios registrados</span><b>${ejN}</b></div></section>`;
  return h;
}

/* ====== vista MES ====== */
function vMes(){
  const {y,m}=mesSel,n=new Date(y,m+1,0).getDate(),hoy=HOY();
  const ks=[...Array(n)].map((_,i)=>K(new Date(y,m,i+1)));
  const esActual=y===hoyD.getFullYear()&&m===hoyD.getMonth();
  let h=`<h2>Mes</h2><div class="nav"><button data-act="mprev" aria-label="Mes anterior">‹</button><b>${cap(MN[m])} ${y}</b><button data-act="mnext" aria-label="Mes siguiente" ${esActual?'disabled':''}>›</button></div>`;
  const habs=S.habitos.filter(x=>ks.some(k=>vive(x,k)));
  if(!habs.length)return h+'<p class="vacio">No hay registros en este mes.</p>';
  const sm=statsMes(y,m);
  h+=`<p class="resumen">${sm.pct===null?'Todavía no hay días para contar.':`Cumpliste el <b>${sm.pct} %</b> de los hábitos diarios programados (${sm.c} de ${sm.p})${sm.mn?`, ${sm.mn} de ellos en versión mínima`:''}. Estudio: <b>${fmtMin(sm.est)}</b>.`}</p>`;
  h+='<div class="grid"><table><thead><tr><th class="nom"></th>'+ks.map(k=>`<th class="d">${k<=hoy?`<button data-act="goday" data-k="${k}">${P(k).getDate()}<br>${DL[P(k).getDay()]}</button>`:P(k).getDate()+'<br>'+DL[P(k).getDay()]}</th>`).join('')+'</tr></thead><tbody>';
  habs.forEach(x=>{h+=`<tr><th class="nom" title="${esc(x.nombre)}">${esc(x.nombre)}</th>${ks.map(k=>celda(x,k,hoy)).join('')}</tr>`;});
  h+=`<tr><th class="nom">Estudio (h)</th>${ks.map(k=>`<td class="n">${fmtCorto((S.dias[k]&&S.dias[k].est)||0)}</td>`).join('')}</tr></tbody></table></div>${leyenda}`;
  h+='<section class="bloque"><h3>Por hábito</h3>'+habs.map(x=>{
    let pct,sub;
    if(x.tipo==='dia'){let p=0,c=0,mn=0;ks.forEach(k=>{if(k<=hoy&&prog(x,k)){p++;const s=st(k,x.id);if(s)c++;if(s===1)mn++;}});pct=p?Math.round(c/p*100):null;sub=`${c} de ${p} días${mn?`, ${mn} en mínimo`:''}`;}
    else{let c=0;ks.forEach(k=>{if(st(k,x.id))c++;});pct=null;sub=`${c} veces en el mes, meta ${x.meta} por semana`;}
    const racha=x.archivado?'Archivado':x.tipo==='dia'?`Racha ${rachaDia(x)} días, mejor ${mejorDia(x)}`:`Racha ${rachaSem(x)} semanas, mejor ${mejorSem(x)}`;
    return `<div class="fila"><div class="izq"><b>${esc(x.nombre)}</b><br><small>${sub}</small><br><small>${racha}</small>${pct!==null?`<div class="barra"><span style="width:${pct}%"></span></div>`:''}</div><div class="der pct">${pct!==null?pct+'%':''}</div></div>`;
  }).join('')+'</section>';
  h+='<section class="bloque"><h3>Comparar meses</h3>';
  for(let i=5;i>=0;i--){const d=new Date(hoyD.getFullYear(),hoyD.getMonth()-i,1),s=statsMes(d.getFullYear(),d.getMonth());
    h+=`<div class="comp"><span>${MN[d.getMonth()].slice(0,3)} ${String(d.getFullYear()).slice(2)}</span><div class="barra"><span style="width:${s.pct||0}%"></span></div><span>${s.pct===null?'sin datos':s.pct+'%'}</span></div>`;}
  h+='<small>Solo cuenta hábitos diarios. Los de "veces por semana" se ven en su racha.</small></section>';
  return h;
}

/* ====== vista HÁBITOS ====== */
function diasTxt(x){
  if(x.tipo==='semana')return `${x.meta} ${x.meta===1?'vez':'veces'} por semana`;
  if(x.dias.length===7)return 'Todos los días';
  return [1,2,3,4,5,6,0].filter(d=>x.dias.includes(d)).map(d=>DL[d]).join(' ');
}
function form(x){
  const nuevo=!x; x=x||{nombre:'',minimo:'',tipo:'dia',dias:[1,2,3,4,5,6],meta:1};
  return `<div class="form">
  <label>Nombre<input id="fn" value="${esc(x.nombre)}" placeholder="Ej: Sacar a pasear a Luna"></label>
  <label>Versión mínima (para días difíciles)<input id="fm" value="${esc(x.minimo)}" placeholder="Lo más chico que igual cuenta"></label>
  <div class="radios"><b style="font-size:14px">Cómo se cuenta</b>
    <label><input type="radio" name="ft" value="dia" ${x.tipo==='dia'?'checked':''}> Cada uno de los días elegidos</label>
    <label><input type="radio" name="ft" value="semana" ${x.tipo==='semana'?'checked':''}> Una cantidad de veces por semana</label></div>
  <label id="fmetaL" ${x.tipo==='semana'?'':'hidden'}>Veces por semana<input id="fmeta" type="number" inputmode="numeric" min="1" max="7" value="${x.meta}"></label>
  <div><b style="font-size:14px">${'Días en que aparece'}</b><div class="chips" style="margin-top:6px">${[1,2,3,4,5,6,0].map(d=>`<button type="button" class="chip ${x.dias.includes(d)?'on':''}" data-act="chip" data-d="${d}" aria-pressed="${x.dias.includes(d)}">${DL[d]}</button>`).join('')}</div></div>
  <div class="botones"><button class="prim" data-act="hguardar">${nuevo?'Agregar hábito':'Guardar cambios'}</button><button class="sec" data-act="hcancel">Cancelar</button>${nuevo?'':'<button class="peligro" data-act="harch">Archivar</button>'}</div>
  </div>`;
}
function vHabitos(){
  const act=S.habitos.filter(x=>!x.archivado),arch=S.habitos.filter(x=>x.archivado);
  let h='<h2>Hábitos</h2>';
  h+=editId==='nuevo'?form(null):'<button class="prim" data-act="hnuevo">Agregar hábito</button>';
  h+='<section class="bloque">'+act.map((x,i)=>`<div class="hrow"><div><b>${esc(x.nombre)}</b><br><small>${diasTxt(x)}</small></div><div class="acc"><button data-act="hup" data-id="${x.id}" aria-label="Subir" ${i===0?'disabled':''}>↑</button><button data-act="hdown" data-id="${x.id}" aria-label="Bajar" ${i===act.length-1?'disabled':''}>↓</button><button data-act="hedit" data-id="${x.id}">Editar</button></div></div>${editId===x.id?form(x):''}`).join('')+'</section>';
  if(arch.length)h+='<section class="bloque"><h3>Archivados</h3><small>Su historial se conserva en las estadísticas.</small>'+arch.map(x=>`<div class="hrow"><div><b>${esc(x.nombre)}</b><br><small>Archivado el ${x.archivado.split('-').reverse().join('/')}</small></div><div class="acc"><button data-act="hrest" data-id="${x.id}">Restaurar</button><button data-act="hborrar" data-id="${x.id}" aria-label="Borrar para siempre">🗑</button></div></div>`).join('')+'</section>';
  const ult=S.ultimaCopia?S.ultimaCopia.split('-').reverse().join('/'):'nunca';
  h+=`<section class="bloque" id="copia"><h3>Copia de seguridad</h3>
  <p style="margin:0 0 10px;font-size:14px">Última copia: <b>${ult}</b>. Guardala fuera del celular: mandátela por WhatsApp o subila a Drive.</p>
  <div class="botones">${navigator.canShare?'<button class="prim" data-act="expshare">Compartir copia</button>':''}<button class="${navigator.canShare?'sec':'prim'}" data-act="expdl">Descargar copia</button><button class="sec" data-act="expcopy">Copiar como texto</button></div>
  <h3 style="margin-top:16px">Restaurar</h3>
  <div class="botones"><button class="sec" data-act="impfile">Elegir archivo de copia</button></div>
  <textarea id="imptxt" rows="3" placeholder="O pegá acá el texto de una copia" style="margin-top:8px"></textarea>
  <div class="botones" style="margin-top:8px"><button class="sec" data-act="imptxt">Restaurar desde el texto</button></div>
  <label style="margin-top:14px;display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600">Meta de estudio del fin de semana (minutos)<input id="metafinde" type="number" inputmode="numeric" min="0" step="15" value="${S.metaFinde}"></label>
  </section>`;
  return h;
}

/* ====== copia de seguridad ====== */
function datosCopia(){return JSON.stringify({app:'habitos-benja',exportado:new Date().toISOString(),datos:S});}
function marcarCopia(){S.ultimaCopia=HOY();guardar();render();}
function exportar(modo){
  const data=datosCopia(),nombre=`habitos-copia-${HOY()}.json`;
  if(modo==='share'){
    try{const f=new File([data],nombre,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Copia de hábitos'}).then(()=>{marcarCopia();toast('Copia compartida');}).catch(()=>{});return;}}catch(e){}
    modo='dl';
  }
  if(modo==='copy'){
    (navigator.clipboard?navigator.clipboard.writeText(data):Promise.reject()).then(()=>{marcarCopia();toast('Copiada. Pegala en un chat o nota.');}).catch(()=>toast('No se pudo copiar. Usá Descargar.'));
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  marcarCopia();toast('Copia guardada en Descargas');
}
function importar(t){
  let o;try{o=JSON.parse(t);}catch(e){toast('Eso no es una copia válida');return;}
  const d=o&&o.datos?o.datos:o;
  if(!d||!Array.isArray(d.habitos)||typeof d.dias!=='object'){toast('La copia no tiene el formato esperado');return;}
  if(!confirm(`La copia tiene ${d.habitos.length} hábitos y ${Object.keys(d.dias).length} días registrados.\nVa a reemplazar TODO lo que hay ahora. ¿Seguir?`))return;
  S=migrar(d);guardar();editId=null;toast('Copia restaurada');render();
}
document.getElementById('archivo').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importar(r.result);r.readAsText(f);e.target.value='';
});

/* ====== render y eventos ====== */
function render(){
  const v={hoy:vHoy,semana:vSemana,mes:vMes,habitos:vHabitos}[tab];
  document.getElementById('app').innerHTML=v();
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}
const habPorId=id=>S.habitos.find(x=>x.id===id);
function mover(id,dir){
  const act=S.habitos.filter(x=>!x.archivado),i=act.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=act.length)return;
  const a=S.habitos.indexOf(act[i]),b=S.habitos.indexOf(act[j]);[S.habitos[a],S.habitos[b]]=[S.habitos[b],S.habitos[a]];guardar();render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b||b.disabled)return;
  if(b.dataset.tab){tab=b.dataset.tab;editId=null;if(tab==='hoy')cur=HOY();render();window.scrollTo(0,0);return;}
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'tog':{const r=dia(cur),s=r.h[id]||0,n=s===0?2:s===2?1:0;if(n)r.h[id]=n;else delete r.h[id];guardar();if(navigator.vibrate)navigator.vibrate(12);render();break;}
    case 'dprev':cur=K(add(P(cur),-1));render();break;
    case 'dnext':if(cur<HOY()){cur=K(add(P(cur),1));render();}break;
    case 'dhoy':cur=HOY();render();break;
    case 'goday':cur=b.dataset.k;tab='hoy';render();window.scrollTo(0,0);break;
    case 'est':{const r=dia(cur);r.est=Math.max(0,(r.est||0)+Number(b.dataset.v));guardar();render();break;}
    case 'ejadd':{const t=document.getElementById('ejt').value,m=parseInt(document.getElementById('ejm').value)||0,n=document.getElementById('ejn').value.trim();const r=dia(cur);r.ej=r.ej||[];r.ej.push({t,m,n});guardar();render();toast('Ejercicio agregado');break;}
    case 'ejdel':{const r=dia(cur);r.ej.splice(Number(b.dataset.i),1);guardar();render();break;}
    case 'sprev':semOff--;render();break;
    case 'snext':if(semOff<0){semOff++;render();}break;
    case 'mprev':{const d=new Date(mesSel.y,mesSel.m-1,1);mesSel={y:d.getFullYear(),m:d.getMonth()};render();break;}
    case 'mnext':{const d=new Date(mesSel.y,mesSel.m+1,1);mesSel={y:d.getFullYear(),m:d.getMonth()};render();break;}
    case 'ircopia':tab='habitos';render();setTimeout(()=>{const c=document.getElementById('copia');if(c)c.scrollIntoView();},50);break;
    case 'hnuevo':editId='nuevo';formDias=[1,2,3,4,5,6];render();break;
    case 'hedit':editId=id;formDias=[...habPorId(id).dias];render();break;
    case 'hcancel':editId=null;render();break;
    case 'chip':{const d=Number(b.dataset.d);formDias=formDias.includes(d)?formDias.filter(x=>x!==d):[...formDias,d];b.classList.toggle('on');b.setAttribute('aria-pressed',formDias.includes(d));break;}
    case 'hguardar':{
      const nombre=document.getElementById('fn').value.trim(),minimo=document.getElementById('fm').value.trim();
      const tipo=document.querySelector('input[name="ft"]:checked').value,meta=Math.min(7,Math.max(1,parseInt(document.getElementById('fmeta').value)||1));
      if(!nombre){toast('Poné un nombre');break;}
      if(!formDias.length){toast('Elegí al menos un día');break;}
      if(editId==='nuevo')S.habitos.push({id:uid(),nombre,minimo,tipo,dias:[...formDias],meta,creado:HOY(),archivado:null,pausas:[]});
      else Object.assign(habPorId(editId),{nombre,minimo,tipo,dias:[...formDias],meta});
      editId=null;guardar();render();toast('Guardado');break;}
    case 'harch':{const x=habPorId(editId);if(confirm(`¿Archivar "${x.nombre}"? Deja de aparecer, pero su historial se guarda.`)){x.archivado=HOY();editId=null;guardar();render();}break;}
    case 'hrest':{const x=habPorId(id);if(x.archivado<HOY())x.pausas.push({desde:x.archivado,hasta:HOY()});x.archivado=null;guardar();render();toast('Restaurado');break;}
    case 'hborrar':{const x=habPorId(id);if(confirm(`¿Borrar "${x.nombre}" para siempre? Se pierde su historial. Esto no se puede deshacer.`)){S.habitos=S.habitos.filter(h=>h.id!==id);Object.values(S.dias).forEach(r=>{if(r.h)delete r.h[id];});guardar();render();}break;}
    case 'hup':mover(id,-1);break;
    case 'hdown':mover(id,1);break;
    case 'expshare':exportar('share');break;
    case 'expdl':exportar('dl');break;
    case 'expcopy':exportar('copy');break;
    case 'impfile':document.getElementById('archivo').click();break;
    case 'imptxt':{const t=document.getElementById('imptxt').value.trim();if(t)importar(t);else toast('Pegá primero el texto de la copia');break;}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='nota'){dia(cur).nota=e.target.value;guardar();}
});
document.addEventListener('change',e=>{
  if(e.target.name==='ft'){const l=document.getElementById('fmetaL');if(l)l.hidden=e.target.value!=='semana';}
  if(e.target.id==='metafinde'){S.metaFinde=Math.max(0,parseInt(e.target.value)||0);guardar();toast('Meta guardada');}
});
render();
</script>
</body>
</html>
